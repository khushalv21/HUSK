<svg width="820" height="470" viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3038"/>
      <stop offset="100%" stop-color="#1a1e24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="788" height="438" rx="12" fill="#0d1117" filter="url(#shadow)"/>
  <rect x="16" y="16" width="788" height="438" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <path d="M16 28 a12 12 0 0 1 12 -12 h752 a12 12 0 0 1 12 12 v26 h-776 z" fill="url(#chrome)"/>
  <line x1="16" y1="54" x2="804" y2="54" stroke="#30363d" stroke-width="1"/>

  <circle cx="38" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="29" r="6" fill="#febc2e"/>
  <circle cx="78" cy="29" r="6" fill="#28c840"/>
  <text x="410" y="33" font-size="12" fill="#7d8590" text-anchor="middle">khushaal — husk — 88x24</text>

  <text x="36" y="80" font-size="13" fill="#7d8590">$ <tspan fill="#e6edf3">husk</tspan></text>

  <text x="36" y="122" font-size="30" font-weight="700" letter-spacing="4" fill="#56d4dd">HUSK</text>
  <text x="36" y="150" font-size="12.5" fill="#c9d1d9">Your codebase's past, present, and architecture — laid bare.</text>

  <text x="36" y="188" font-size="13" font-weight="700" fill="#d29922">COMMANDS:</text>

  <text x="36" y="210" font-size="13" font-weight="700" fill="#3fb950">  husk scan [path_or_url] [--detailed] [--with-ai]</text>
  <text x="36" y="228" font-size="12.5" fill="#c9d1d9">    Crawl the repo and inventory files, classes, functions, and imports.</text>

  <text x="36" y="250" font-size="13" font-weight="700" fill="#3fb950">  husk hotspots [path_or_url]</text>
  <text x="36" y="268" font-size="12.5" fill="#c9d1d9">    Rank source files by maintenance risk (Complexity x Git Churn).</text>

  <text x="36" y="290" font-size="13" font-weight="700" fill="#3fb950">  husk ask "query" [path_or_url] [--rebuild]</text>
  <text x="36" y="308" font-size="12.5" fill="#c9d1d9">    Ask questions about the codebase in plain English via RAG.</text>

  <text x="36" y="338" font-size="13" font-weight="700" fill="#d29922">EXAMPLES:</text>
  <text x="36" y="360" font-size="12.5" fill="#c9d1d9">  husk init                 <tspan fill="#6e7681"># choose "local" — no API key required</tspan></text>
  <text x="36" y="380" font-size="12.5" fill="#c9d1d9">  husk ask "how does authentication work?"</text>

  <text x="36" y="412" font-size="12" fill="#7d8590">Run 'husk COMMAND --help' for full options on any command.</text>

  <rect x="36" y="422" width="7" height="14" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
